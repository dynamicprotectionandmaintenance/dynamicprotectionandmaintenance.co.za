<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/favicon.png"><title>Gallery Administration | DPM</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f8;color:#17202a;font:16px/1.6 Arial,sans-serif}header{background:#17202a;color:white;padding:24px}header div,main{max-width:1000px;margin:auto}header p{margin:0;color:#e2c18b}h1{font-size:24px;margin:0}main{padding:24px}section,article{background:white;border:1px solid #ddd;border-radius:10px;padding:22px;margin-bottom:20px}label{display:block;font-weight:bold;margin-top:12px}input,textarea{width:100%;padding:12px;border:1px solid #bbb;border-radius:5px;font:inherit}button{background:#b07b2c;color:white;border:0;padding:12px 18px;border-radius:5px;font-weight:bold;cursor:pointer;margin:12px 8px 0 0}button:disabled{opacity:.5;cursor:wait}.danger{background:#923c36}a{color:inherit}#projects{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}article img{width:100%;height:180px;object-fit:cover;border-radius:5px}#status{white-space:pre-wrap} [hidden]{display:none!important}
</style></head><body><header><div><h1>Dynamic Protection &amp; Maintenance</h1><p>Gallery Administration</p><a href="/gallery.html">View public Gallery</a></div></header><main><p id="status" role="status" aria-live="polite"></p><section id="login"><h2>Administrator login</h2><form id="loginForm"><label for="email">Email address</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button>Sign in</button></form></section><div id="manager" hidden><section><button id="logout" type="button">Sign out</button><h2>Upload project photographs</h2><form id="uploadForm"><label for="title">Project title (optional)</label><input id="title" maxlength="200"><label for="description">Description (optional)</label><textarea id="description" maxlength="3000"></textarea><label for="photos">Photographs (JPEG, PNG, WEBP; max 10 MB each)</label><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple required><button>Upload and publish</button></form></section><h2>All Projects</h2><div id="projects"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/gallery-admin.js"></script></body></html>
